name: Homologação - testes do repositório
run-name: Testes de homologação - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit completo confirmado pelo painel (40 caracteres)
        required: true
        type: string

# Sem acesso de escrita, deploy, secrets do Supabase ou runners locais.
permissions:
  contents: read

concurrency:
  group: homologacao-testes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: homologacao
      SUPABASE_URL: https://projeto-teste.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_teste
      LSASSIST_ENV_FILE: .env.ci-inexistente
    steps:
      - name: Confirmar commit solicitado
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Dependências backend
        run: python -m pip install '.[dev]'
      - name: Ruff
        run: python -m ruff check backend tests main.py
      - name: Testes automatizados (sem banco real)
        run: python -m pytest -q --junitxml=resultado-pytest.xml
      - name: Dependências frontend
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Escopo da verificação
        if: always()
        run: |
          echo '## Testes de repositório, sem publicação' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Não valida ZIP, RLS real, migrations ou compatibilidade da versão instalada.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cada etapa e sua conclusão estão disponíveis no log desta execução.' >> "$GITHUB_STEP_SUMMARY"
